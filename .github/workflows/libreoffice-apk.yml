name: Build bundled LibreOffice APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android native toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;26.3.11579264"             "cmake;3.22.1"

      - name: Stage LibreOfficeKit engine
        run: scripts/setup-libreoffice.sh arm64-v8a

      - name: Build installable APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Normalize APK name
        run: cp app/build/outputs/apk/debug/app-debug.apk FileVault-LibreOffice-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FileVault-LibreOffice-arm64
          path: FileVault-LibreOffice-arm64.apk
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
