name: Build bundled LibreOffice APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: libreoffice-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android native toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Stage LibreOfficeKit engine
        run: scripts/setup-libreoffice.sh arm64-v8a

      - name: Verify LibreOffice engine really was staged
        run: |
          set -euo pipefail
          test -s app/src/main/assets/lo/lo-assets.zip
          ls -l app/src/main/jniLibs/arm64-v8a/
          size=$(stat -c%s app/src/main/assets/lo/lo-assets.zip)
          echo "engine bundle: $size bytes"
          test "$size" -gt 20000000
          test "$(ls app/src/main/jniLibs/arm64-v8a/*.so | wc -l)" -ge 1

      - name: Build installable APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Normalize APK name
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk file-seperate.apk
          ls -l file-seperate.apk
          head -c2 file-seperate.apk | grep -q PK
          unzip -l file-seperate.apk | grep -q 'lib/arm64-v8a/.*\.so'
          unzip -l file-seperate.apk | grep -q 'assets/lo/lo-assets.zip'
          test "$(stat -c%s file-seperate.apk)" -gt 50000000

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-seperate-apk
          path: file-seperate.apk
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Latest Android build
          body: |
            Rolling build of File-seperate with the full LibreOffice
            (LibreOfficeKit) engine bundled — arm64-v8a, debug-signed.

            **Download:** [`file-seperate.apk`](https://github.com/${{ github.repository }}/releases/download/android-latest/file-seperate.apk)

            This tag always points at the newest successful build.

            | | |
            |---|---|
            | Commit | `${{ github.sha }}` |
            | Built | `${{ github.run_id }}` |
            | ABI | `arm64-v8a` |
          files: file-seperate.apk
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
